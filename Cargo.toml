[package]
name = "tezbar-markdown-table-generator-process"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
description = "Standalone Rust Markdown Table Generator process extension"
repository = "https://github.com/almatkai/markdown-table-generator"

[[bin]]
name = "tezbar-markdown-table-generator"
path = "native/main.rs"

[workspace]
members = ["v2"]
resolver = "2"

[dependencies]
tezbar-markdown-table-generator = { path = "v2" }
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "aaec571673ab64a85a136cf6bd054ef660c4d93c" }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
