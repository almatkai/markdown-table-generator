[package]
name = "tezbar-markdown-table-generator"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
description = "Bounded Markdown Table Generator for Tezbar Native V2"
repository = "https://github.com/almatkai/markdown-table-generator"
include = ["/src/**", "/examples/**", "/tests/**", "/scripts/**", "/assets/**", "/licenses/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/NOTICE", "/manifest.json", "/provenance.json", "/tezbar_adapter.rs"]

[dependencies]

[dev-dependencies]
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["macros", "rt", "sync"] }
tempfile = "=3.15.0"
log = "=0.4.28"
